# Database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=yes&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.datasource.initialization-mode=always
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.datasource.sqlScriptEncoding=UTF-8
spring.jpa.properties.hibernate.jdbc.time_zone = UTC
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

spring.liquibase.change-log=classpath:liquibase/db.changelog-master.xml
spring.liquibase.enabled=true

server.port = ${PORT}
spring.main.allow-bean-definition-overriding=true
spring.jackson.serialization.INDENT_OUTPUT= true

#EXCEPTION HANDLER
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.resources.add-mappings=false

#@RestController
spring.data.web.pageable.max-page-size=50
#@RepositoryRestResource
spring.data.rest.max-page-size=50

#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level.org.hibernate.type=TRACE

#LOG
logging.pattern.file= "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
logging.level.root=WARN
logging.level.com.movie.api=DEBUG
logging.level.org.springframework.web=WARN
logging.file.path=logs/
logging.file.name=logs/movie-api.log
#logging.file=${catalina.home}/logs/spam.log

management.endpoints.web.exposure.include=* 
spring.jpa.open-in-view=false

#Email
spring.mail.default-encoding=UTF-8
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Thread pool
thread.pool.size=10
thread.pool.queue.size=100

# Feign client
feign.client.config.default.connectTimeout=60000
feign.client.config.default.readTimeout=60000

#oauth2 key
auth.signing.key=${AUTH_SIGNING_KEY}

#Auth service
auth.internal.base.url=http://localhost:8787

#Media service
media.internal.base.url=http://localhost:7474

#Internal authorization
auth.internal.basic.username=abc_client
auth.internal.basic.password=abc123

#Server internal
server.internal.password=${SERVER_INTERNAL_PASSWORD}
auth.internal.api.key=${AUTH_INTERNAL_PASSWORD}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

rabbitmq.convert.video.queue=CONVERT_VIDEO_QUEUE
rabbitmq.update.video.queue=UPDATE_VIDEO_QUEUE
rabbitmq.streaming.queue=STREAMING_QUEUE
rabbitmq.sns.broadcast.queue=SNS_BROADCAST_QUEUE
rabbitmq.account.exchange=ACCOUNT_FANOUT_EXCHANGE
rabbitmq.account.queue.movie=ACCOUNT_SYNC_MOVIE_QUEUE
rabbitmq.app=BACKEND_APP

# Redis
redis.sentinel.hosts=${REDIS_SENTINEL_HOSTS}
redis.master.name=${REDIS_MASTER_NAME}
redis.host=${REDIS_HOST}
redis.type=${REDIS_TYPE}
redis.password=${REDIS_PASSWORD}
spring.data.redis.repositories.enabled=false
